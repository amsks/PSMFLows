# Per-task offline RL in the flow's latent space -- the ceiling probe (P2 of the
# psm-fix roadmap). NOT zero-shot: it trains on the actual task reward. It answers
# whether the latent action space can support a working improvement loop at all,
# which bounds the headroom of any zero-shot method built on the same substrate.
agent_name: latentrl

lr: 3.0e-4
batch_size: 256
value_hidden_dims: [512, 512, 512, 512]
layer_norm: true
num_parallel: 2
discount: 0.99          # FB's value; 0.98 gives a ~50-step horizon, myopic for these tasks
tau: 0.005
pessimism_penalty: 0.5
actor_pessimism_penalty: 0.5
alpha: 10.0             # BC weight toward the dataset latent u* (critic_input=action)
z_dim: 8                # width of the constant vector fed to the actor's z-slot (unused)
u_clip: 3.0

# WHAT THE CRITIC SCORES.
#   action (default, and what every run before 2026-09-03 did): Q(s, a) over EXECUTED
#     actions, so the gradient reaches the actor through the frozen decoder. Capped at
#     0.142 at residual_eps=0; the epsilon=0.05 residual arm reached 0.905.
#   latent: Q(s, u) -- the offline DSRL variant (Wagenmaker et al. 2025) made runnable by
#     the Stage-B preimages, which supply the noise offline data does not carry. The frozen
#     flow is NEVER called during training; it reappears only at acting time. Requires
#     residual_eps=0 (asserted): a residual the critic cannot see is uninterpretable.
critic_input: action
# BC weight on the latent anchor under critic_input=latent. Defaults to `alpha` so the two
# paths share one number unless overridden; 0.0 is legal and is the pure-DSRL setting.
bc_alpha_latent: 10.0

# W4 bounded residual head: executed action = clip(decode(u) + residual_eps * delta(s,u)),
# delta tanh-bounded. 0.0 leaves the head inert (but the critic still scores executed
# actions, so eps=0 is its own anchor arm, not a rerun of the latent-critic P2 agent).
residual_eps: 0.0
residual:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2

actor:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2

# FROZEN behavior flow -- must be the same Stage-A ckpt psmflow decodes through.
flow:
  hidden_dims: [512, 512, 512, 512]
  value_hidden_dims: [512, 512, 512, 512]
  layer_norm: false
  critic_layer_norm: true
flow_ckpt_path: null
flow_ckpt_epoch: null
preimage_path: null
use_point_preimage: true

ob_dims: null
action_dim: null
encoder: null
