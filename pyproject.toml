[project]
name = "fql"
version = "0.0.0"
requires-python = ">= 3.9"

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.ruff]
target-version = "py310"
line-length = 120
# archive/ is the 2026-09-04 attic: every agent except psmflow and fql, plus the tools,
# scripts, tests and plans tied to them or to settled-negative hypotheses. It is frozen
# code kept for history and revival, not maintained code -- do not lint it.
exclude = ["archive"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
# `pytest` from the repo root means tests/ and nothing else. archive/tests holds the suites
# of the archived agents; they are kept so an un-archived agent arrives with its tests, but
# they import archive.* and must not be collected by the normal run.
testpaths = ["tests"]
norecursedirs = ["archive", ".venv", ".git", "PAPER", "*.egg-info"]
