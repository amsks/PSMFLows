[project]
name = "fql"
version = "0.0.0"
requires-python = ">= 3.9"

[project.optional-dependencies]
dev = [
    "ruff",
]

[tool.ruff]
target-version = "py310"
line-length = 120
[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
# `pytest` from the repo root means tests/ and nothing else. The archived agents' suites
# live on the `archive` branch alongside the agents they cover.
testpaths = ["tests"]
norecursedirs = [".venv", ".git", "PAPER", "*.egg-info"]
