num_clusters: 1
# Inverse temperature of the preimage target pi(u) ~ exp(-alpha*||G(s,u) - a||^2).
#
# RETUNED 2026-08-31, and every number below the next divider is from the OLD un-squared
# target exp(-alpha*||G - a||) with the alpha^2 Laplace covariance. Both were corrected on
# 2026-08-31 (agents/fql.py: squared L2 at :116/:201, covariance 2*alpha J^T J at :88), so
# every alpha tuned against the old form -- including the 20.0 this file used to carry --
# means something different now and cannot be read across. Existing mixture npz files were
# written under the old form; they are not invalidated as files, but their alpha does not
# transfer. The point arm (use_point_preimage=true), which carries every shipped result,
# is untouched by all of this.
#
# Sweep under the CORRECTED target, 256 rows, seed 0, flow_steps=100, num_samples=200,
# prior_scale=1.0, on the cube and antmaze Stage-A checkpoints:
#
#              cube                              antmaze
#   alpha    ESS  decode_mix  cov_k16      ESS  decode_mix  cov_k16
#   20 OLD  112.9     0.1682    0.890      8.8      0.1758    0.016   <- old target
#      20   131.7     0.2224    0.945     16.4      0.2964    0.258
#      50   132.6     0.1747    0.897     18.8      0.2023    0.064
#     100   133.1     0.1365    0.807     19.1      0.1464    0.007
#     200   136.1     0.1021    0.580     20.4      0.1042    0.002
#     400   139.1     0.0749    0.249     20.2      0.0730    0.000
#     800   138.2     0.0546    0.066     19.2      0.0521    0.000
#    1600   137.9     0.0395    0.013     16.2      0.0361    0.000
#    3200   137.0     0.0252    0.003     10.2      0.0261    0.000
#
# ESS and decode error both improve with alpha while COVERAGE collapses: raising alpha
# shrinks the mixture toward the point preimage, which is the same "the mixture is a
# blurred point, its width is temperature" finding the width sweeps reached. So alpha is a
# position on a frontier, not an optimum to be found.
#
# 50.0 is chosen as the matched-fidelity analogue of the old operating point: it reproduces
# the old decode error and coverage on cube (0.175/0.897 vs 0.168/0.890) while ESS goes
# 112.9 -> 132.6, and on antmaze it more than doubles ESS (8.8 -> 18.8) and quadruples
# coverage (0.016 -> 0.064) for slightly worse decode (0.176 -> 0.202). Pick a different
# point on the table if a regeneration wants fidelity over coverage.
#
# ---- everything below is from the OLD un-squared target; kept for provenance ----
#
# At alpha=1 the target is far broader than the proposal: near the preimage
# ||G(s,u) - a|| ~ sigma*||u - u*|| with sigma = ||d(action)/d(noise)|| ~ 0.1 (median
# singular value 0.068 on the Stage-A cube ckpt), so the target's width in u-space is
# ~1/(alpha*sigma) ~ 10 -- an order of magnitude BROADER than the N(0,I) prior, while the
# Laplace proposal is clipped to exactly the prior for 99.8% of rows. A narrow proposal
# against a broad target is what collapses ESS. Raising alpha fixes that, and also sharpens
# the point preimage (||G(s,mu)-a||), which is why it is set high here.
#
# Sweep re-measured 2026-08-03 on the first 512 cube rows, num_clusters=1, num_samples=100
# (TRACE-MEAN ESS -- see the 2026-08-04 CORRECTION below; final-step ESS runs higher):
#     alpha    mean ESS   median   frac ESS>20   ESS/N
#       1.0        9.23     7.46         0.084   0.092
#       5.0       13.19    10.36         0.218   0.132
#      10.0       17.42    13.75         0.337   0.174
#      20.0       18.39    14.26         0.361   0.184
#      50.0       17.84    13.62         0.348   0.178
#     100.0       18.39    14.08         0.360   0.184
#
# SUPERSEDES an earlier table here that read ~21.8 at alpha=20 and concluded alpha alone
# clears the gate: that table was produced with the pre-fix `preimage_ess`, which returned
# exactly `num_samples` -- its best value -- for rows where no sample was usable.
#
# CORRECTION 2026-08-04: the table ABOVE (and the 49.3/82.0 below) is the TRACE-MEAN ESS.
# validate_flow_inversion.py used to average over all 10 EM iterations, but Stage B stores
# (and precompute_preimages.py persists) only the FINAL iterate, and ESS improves across
# iterations -- so the tool understated the stored posterior. It now gates on ess[:, -1].
# Re-measured on the cube Stage-A ckpt (256 rows, seed 0), alpha=20, N=100: final-step
# mean ESS 21.7 (trace-mean 17.7) -- the D3 gate PASSES at N=100, marginally. So the
# 08-03 reading "ESS saturates ~18.4 and NO alpha reaches 20" was an artifact of the trace
# statistic, and the 07-29 conclusion "alpha=20 clears the gate" was directionally right
# (its 21.8 number was still inflated by the pre-fix metric; the honest value is ~21.7).
#
# num_samples buys MARGIN, linearly: ESS ~ N / (1 + CV^2(w)), and per-sample efficiency
# also improves because the EM fits a better proposal from more draws -- trace-mean ESS/N
# at alpha=20 goes 0.184 (N=100) -> 0.264 (N=200) -> 0.341 (N=400). At alpha=20, N=200
# the gate passes comfortably on both envs (trace-mean 49.3 cube / 82.0 pointmaze;
# final-step higher still). N=200 is kept for headroom over the marginal N=100 pass; cost
# is linear, ~19.5 h per 1M rows at batch_size=256 (17.95 s / 256 rows vs 9.02 s at N=100).
# Changing either knob invalidates existing preimage npz files.
# Weight on the flow's OWN latent prior N(0, I) in the inversion target:
#     pi(u) ~ N(u; 0, I)^prior_scale * exp(-alpha * ||G(s,u) - a||)
# 1.0 is the actual posterior p(u | s, a) and is what a latent-space policy needs.
# 0.0 is the likelihood-only target used by every npz written before 2026-08-14: flat in
# every direction the decoder cannot see, so the EM fit has no finite answer and runs away
# (max covariance eigenvalue 1 -> 6 -> 34 -> 305 -> 2281 -> 6095 over 8 steps; in the
# shipped files 84% of cube rows and 50% of pointmaze rows carry a per-dim variance wider
# than the prior, worst case 3.8e4, with means out at |mu| = 206). Set 0.0 only to
# regenerate a legacy file. Changing it invalidates existing preimage npz files.
prior_scale: 1.0
alpha: 50.0            # see the frontier table above; retuned for the squared target
num_samples: 200
n_steps: 10
n_initial_steps: 100
batch_size: 256
seed: 0
# Preimages from an untrained flow carry no behavior information. Guard against running
# the whole (expensive) precompute without restore_path; true only for plumbing smokes.
allow_untrained: false
