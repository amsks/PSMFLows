num_clusters: 1
# Inverse temperature of the preimage target pi(u) ~ exp(-alpha*||G(s,u) - a||).
# MEASURED TOO LOW ON CUBE, and it is what fails the D3 ESS gate. Near the preimage
# ||G(s,u) - a|| ~ sigma*||u - u*|| with sigma = ||d(action)/d(noise)|| ~ 0.1 (median
# singular value 0.068 on the Stage-A cube ckpt), so the target's width in u-space is
# ~1/(alpha*sigma) ~ 10 at alpha=1: an order of magnitude BROADER than the N(0,I) prior,
# while the Laplace proposal is clipped to exactly the prior for 99.8% of rows. A narrow
# proposal against a broad target is what collapses ESS. Sweep over 512 cube rows,
# everything else as configured:
#     alpha    mean ESS   frac ESS>20   post. width/prior   ||mu||   ||G(s,mu)-a||
#       1.0        9.99         0.115               4.124    3.945          0.323
#       5.0       15.35         0.301               2.653    2.770          0.166
#      10.0       20.31         0.404               1.977    2.575          0.104
#      20.0       21.81         0.438               0.939    2.602          0.055
#      50.0       21.79         0.436               0.292    2.534          0.022
# ESS saturates by ~20 (the D3 gate needs mean > 20) and the posterior first becomes
# narrower than its prior there, i.e. starts behaving like a posterior at all; past 20 it
# over-tightens for no ESS gain. NOTE this is the OPPOSITE direction from lowering alpha to
# flatten the target -- that raises ESS only by discarding information, and is measurably
# not what is happening here. Changing this invalidates existing preimage npz files
# (~10 h to recompute 1M rows), so it is left at the as-run value pending that call.
alpha: 1.0
num_samples: 100
n_steps: 10
n_initial_steps: 100
batch_size: 256
seed: 0
# Preimages from an untrained flow carry no behavior information. Guard against running
# the whole (expensive) precompute without restore_path; true only for plumbing smokes.
allow_untrained: false
