defaults:
  - _self_
  - agent: fql
  - inversion: default

# Run parameters (formerly absl flags in main.py).
wandb_project: PSMFLows
wandb_entity: amsks        # personal entity; do NOT fall back to the al-laq-fb team default
run_group: Debug
seed: 0
env_name: cube-double-play-singletask-v0
save_dir: exp/
restore_path: null
restore_epoch: null

# tools/precompute_preimages.py (Stage B). `preimage_limit` slices the dataset for
# plumbing smokes; null means the whole thing (~1M transitions on OGBench).
preimage_out: preimages.npz
preimage_limit: null
# Diagnostic tools (D1-D4) write their JSON report here; null = <hydra run dir>/<tool>.json.
# They used to print to stdout only, which is how the 2026-08-03 D2 numbers were lost.
report_out: null

offline_steps: 1000000
online_steps: 0
buffer_size: 2000000
log_interval: 5000
eval_interval: 20000
save_interval: 1000000

eval_episodes: 10  # match reference eval_n_episodes (evals/ogbench.py rollout)
# tools/eval_checkpoint.py only. Split the eval episodes over N worker PROCESSES on one
# GPU (rollout is one CPU core plus ~3.2 GB of an 80 GB H100, so N of them fit). 1 keeps
# the historical single-process path bit for bit; EVAL_WORKERS in the environment is the
# other way to set it. main.py's in-loop eval ignores this.
eval_workers: 1
video_episodes: 0
video_frame_skip: 3

# PSM eval reward-inference protocol (match reference evals/ogbench.py):
# infer z from `eval_relabel_size` states with rewards shifted by `eval_reward_shift`.
eval_relabel_size: 10000
eval_reward_shift: 1.0

p_aug: null
frame_stack: null
dataset_fraction: 1.0    # episode-level seeded subsample of the training set (Idea 2b/2c)
dataset_fraction_seed: 0
balanced_sampling: 0

dataset:
  # Replace the training set's `rewards` with the `rewards` array of this npz, row for row
  # (tools/relabel_reward_rhat.py writes r_hat = phi(s')^T w from a frozen checkpoint).
  # The length must match; nothing else in the dataset changes. null = the dataset's own.
  reward_override_path: null
