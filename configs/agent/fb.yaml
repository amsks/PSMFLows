agent_name: fb
batch_size: 256
z_dim: 50
L_dim: 50
num_parallel: 2
discount: 0.99
f_target_tau: 0.005
b_target_tau: 0.005
ortho_coef: 1.0
train_goal_ratio: 0.5     # fraction of z replaced by B(next_obs) (perm goal-mode)
fb_pessimism_penalty: 0.0
actor_pessimism_penalty: 0.0
actor_std: 0.2
stddev_clip: 0.3
norm_z: true
actor_encode_obs: false   # actor consumes raw obs; F consumes left_encoder(obs)
weight_decay: 0.0

lr_f: 1.0e-4
lr_b: 1.0e-4
lr_actor: 1.0e-4

forward:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
backward:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
left_encoder:
  hidden_dim: 512
  hidden_layers: 4
  norm: true
actor:
  type: flow              # td3 | flow
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
  bc_coeff: 3.0
  flow_steps: 10
  lr_actor_vf: 3.0e-4
  flow_actor_hidden_dim: 512
  flow_actor_hidden_layers: 2
  flow_actor_embedding_layers: 2
  flow_vf_hidden_dim: 512
  flow_vf_hidden_layers: 4

ob_dims: null
action_dim: null
encoder: null
