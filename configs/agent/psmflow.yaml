agent_name: psmflow
batch_size: 1024
z_dim: 128
num_parallel: 2
discount: 0.98
tau: 0.01
ortho_coef: 1000.0        # reference PSM sweep winner
pessimism_penalty: 0.0
actor_pessimism_penalty: 0.5
norm_z: true

lr_phi: 1.0e-5
lr_sf: 1.0e-4
lr_actor: 1.0e-4
lr_actor_vf: 3.0e-4

phi:
  hidden_dim: 256
  hidden_layers: 2
sf:
  hidden_dim: 1024
  hidden_layers: 1
  embedding_layers: 2

# Amortized LATENT actor (flowBC recipe over latents, Rung 3). Off by default: v1
# inference is flow-GPI; enable for the actor ablation / deployment path. The actor emits
# u in [-u_clip, u_clip]; the deployed action is the frozen flow's decode of that u.
actor:
  enabled: false
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
  vf_hidden_dim: 512
  vf_hidden_layers: 4
  flow_steps: 10           # Euler steps for the latent-BC ODE distillation target
  bc_coeff: 1.0            # distillation weight (reference cube value is 3.0)
  task_mix_ratio: 0.5      # P(w from phi(next_obs[perm])) vs random unit z
acting: gpi                # gpi | actor

# FROZEN behavior flow — must match the Stage-A `agent=fql agent.bc_only=true` run.
flow:
  hidden_dims: [512, 512, 512, 512]
  value_hidden_dims: [512, 512, 512, 512]
  layer_norm: false
  critic_layer_norm: true
flow_ckpt_path: null       # REQUIRED for real runs (dir glob, restore_agent convention)
flow_ckpt_epoch: null
allow_untrained_flow: false
preimage_path: null        # REQUIRED: tools/precompute_preimages.py output npz
use_point_preimage: false  # point-vs-mixture ablation

index_mix_ratio: 0.5       # P(u' from behavior preimages) vs N(0, I)
u_clip: 3.0                # typical-set clamp on latent draws

gpi_num_u: 64
gpi_num_uprime: 16
gpi_decode: onestep        # onestep | ode
flow_decode_steps: 10

ob_dims: null
action_dim: null
encoder: null
