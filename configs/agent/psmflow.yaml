agent_name: psmflow
batch_size: 1024
z_dim: 128
num_parallel: 2
discount: 0.98
tau: 0.01
ortho_coef: 1000.0        # reference PSM sweep winner

# --- measure-loss stabilisers (2026-09-07). BOTH DEFAULT OFF: `ortho_mode: fixed` and
# `psi_bound: none` reproduce, expression for expression, the loss every published number
# was produced with, so no checkpoint and no eval500 number moves because these exist.
# docs/design/2026-09-07-antmaze-g995-collapse.md measured the failure they answer: on
# antmaze at discount 0.995 the contrastive term `psm_loss` grows one decade per 31k steps
# (three seeds, agreeing to three significant figures), outgrows `ortho_coef*|orth_loss|`
# = 6.4e4 at 115-125k, and phi then collapses toward rank one -- 500-ep success 0.52@100k
# -> 0.01@300k. At discount 0.99 the same divergence runs ~4x slower.
#   fixed     (DEFAULT) the ortho term is weighted by ortho_coef alone, so a diverging TD
#             term eventually dwarfs it and phi is free to buy TD loss with collapse.
#   relative  weight = ortho_coef + ortho_rel_coef * stopgrad(|psm_loss|). Both gradient
#             contributions then scale together and the ratio that decides whether phi may
#             collapse is invariant to the absolute level of the TD term. The weight is
#             stop-gradded and ortho does not depend on psi, so this changes phi's gradient
#             direction and nothing else.
ortho_mode: fixed          # fixed | relative
# At the healthy g99 baseline (|orth_loss| = 64) ortho_rel_coef = 1.0 holds the ortho term
# at 64x psm_loss; the measured healthy ratio band is ~2-100 (cube 1.8-43, antmaze g99
# ~100, antmaze g995 ~25 before it diverged), so 1.0 sits mid-band.
ortho_rel_coef: 1.0        # ortho_mode: relative only
# Where the magnitude ceiling on the measure is imposed. phi is projected to the sphere of
# radius sqrt(z_dim) and w(u') is unit-norm, so A(s,u) and beta(s,u) are the ONLY free
# magnitude in the model, and psi_q_spread is what runs 7 -> 2e8.
#   none         (DEFAULT) unbounded, as published.
#   tanh         bounded REPARAMETERISATION of the head: psi = S*tanh((A^T w + beta)/S).
#                Elementwise, monotone, identity to first order at |psi| << S, so psi keeps
#                the affine head's sign structure and its ordering in the policy slot.
#   clip_target  the same admissible set imposed on the TD bootstrap instead: target_M
#                clipped to +-(S * z_dim), the Cauchy-Schwarz image of the psi ball
#                (|psi^T phi| <= (S sqrt(z))(sqrt(z))). Forward pass untouched.
psi_bound: none            # none | tanh | clip_target
# S, the per-component ceiling on psi -- derived, not swept: under the orthonormality the
# ortho term enforces, E[phi phi^T] = I, so psi_i = E[sum_t gamma^t phi_i(x_t)] with phi_i
# of unit RMS and |psi_i| <= 1/(1-gamma) = 200 at gamma 0.995 (100 at 0.99). Healthy runs
# read |Q| ~ 1e3 against this bound's worst case ~2.5e4, so it does not bind on a healthy
# trajectory; the diverged runs read |Q| ~ 1e9.
psi_bound_scale: 200.0     # psi_bound != none only
# 0.5 with num_parallel=2 is EXACT min-Q in the TD target (mean - |q1-q2|/2 = min).
# Added 08-05: the actor-coupled backup (unlike the old fixed-index one) is an
# improvement loop, and without target pessimism actor_q oscillated 450<->6500 on
# pointmaze. PSM ships 0.0 here but its phi is anchored by the proto branch.
pessimism_penalty: 0.5
actor_pessimism_penalty: 0.5
norm_z: true

lr_phi: 1.0e-5
lr_sf: 1.0e-4
lr_actor: 1.0e-4
lr_actor_vf: 3.0e-4

phi:
  hidden_dim: 256
  hidden_layers: 2
sf:
  hidden_dim: 1024
  hidden_layers: 1
  embedding_layers: 2

mix_ratio: 0.5             # P(w from phi(next_obs[perm])) vs random unit z (PSM's sample_mixed_z)

# Amortized LATENT actor (flowBC recipe over latents). OFF by default: the primary agent
# is the paper-strict one (`train_actor: false`, `acting: gpi`), which has
# no actor at all -- the backup bootstraps a p0 index draw, not an actor latent. The block
# below is still live under `train_actor: true` (DSRL-style arm, and the substrate for the
# planned DSRL-NA distillation of the GPI argmax). The actor emits u in [-u_clip, u_clip];
# the deployed action is the frozen flow's decode of that u.
actor:
  hidden_dim: 512
  hidden_layers: 2
  embedding_layers: 2
  vf_hidden_dim: 512
  vf_hidden_layers: 4
  flow_steps: 10           # Euler steps for the latent-BC ODE distillation target
  bc_coeff: 1.0            # distillation weight (reference cube value is 3.0)
  # How many prior policy indices u' the ACTOR's Q is aggregated over.
  # 0 (DEFAULT) = psi at the ONE u' this batch element drew. That gradient was measured
  # (docs/design/2026-09-06-dsrl-actor-audit.md) at cosine -0.49 / -0.20 against the gradient
  # of the panel max -- i.e. the actor was climbing an objective ANTI-correlated with the
  # one gpi_select maximises, which is why the latent-actor arm is flat (cube 0.162/0.130
  # against the actor-free arm's 0.415 late mean on the SAME critic). K > 0 makes the
  # actor climb max_k psi(s, u, u'_k)^T w, the acting rule's own objective. Under
  # psi_form=affine this costs one einsum, not K towers (A(s,u) does not see u').
  # Requires policy_index=latent and index_agg=max.
  index_panel: 0
  # --- actor_mode != ddpg only (the DSRL arms) ---
  q_coeff: 1.0             # weight on the (alpha*log pi - Q) term; 0.0 = pure distillation
  na_coeff: 1.0            # weight on the GPI-argmax regression (dsrl_na)
  na_candidates: 16        # prior action latents scored per state to form that argmax
  na_states: 256           # batch rows the NA target is built on (cost = na_states x
                           # na_candidates psi forward passes per step)
  na_advantage_weight: false   # weight each state's regression by its Q advantage
  entropy: auto            # auto (tune alpha to target_entropy) | fixed (alpha=init_alpha)
  target_entropy: 0.0      # DSRL's `target_ent`, NOT -dim(A); stated in the squashed,
                           # unscaled space tanh_gaussian_sample computes log pi in
  init_alpha: 1.0
  lr_alpha: 3.0e-4
  log_std_min: -20.0       # SB3's clamp, ported verbatim
  log_std_max: 2.0
# Which latent actor `train_actor: true` trains and `acting: actor` deploys.
#   ddpg      (DEFAULT) the shipped NoiseConditionedActor + flowBC recipe:
#             -Q/|Q| + bc_coeff * distill + the CFM velocity field.
#   dsrl_sac  DSRL's actor ported to latents: a tanh-Gaussian pi(u | s, w) over the box
#             [-u_clip, u_clip], reparameterised, with SAC's entropy term and an
#             auto-tuned alpha (sb3_dsrl/stable_baselines3/sac/sac.py:279-294).
#   dsrl_na   DSRL-NA's prior-only signal, distilled into the POLICY instead of into a
#             second critic (psi already IS a critic over latents): a regression onto
#             argmax over na_candidates prior draws of the panel-max GPI score. Every
#             target is a p0 draw, which is the support device that replaces bc_coeff.
# See docs/design/2026-09-06-dsrl-actor-audit.md.
actor_mode: ddpg           # ddpg | dsrl_sac | dsrl_na
acting: gpi                # gpi | actor. DEFAULT gpi: the write-up's Sec. PSMFlows agent
                           # acts by a per-step argmax over (u_i, u'_j) pairs and has no
                           # actor at all. `actor` selects the amortized latent actor above
                           # (DSRL-style); it is a non-default switch, kept for the planned
                           # DSRL-NA distillation of the GPI argmax into an amortized head.

# psi's index slot. `latent` (DEFAULT) is the write-up's psi(s, u, u') — a fresh u' ~ p0 per
# batch element indexes the policy, the backup continues that SAME u' at s' (so the bootstrap
# action is a p0 decode, which is Prop. insample's hypothesis and makes backup_explore_frac
# inert), and w reaches psi only through the readout Q = psi^T w. Under `latent` acting must
# be gpi, which then searches (u_i, u'_j) pairs per Alg. "Rung 1".
# `task_vector` is the older shipped agent: psi(s, w, u), policy identity carried in w.
policy_index: latent       # latent | task_vector
# How psi is parameterised in its policy slot. `affine` (DEFAULT) restores
# Prop. bilinear literally,
#     psi(s, u, u') = A(s,u)^T w(u') + beta(s,u),
# with w(.) a learned encoder from the policy latent u' to R^{w_dim} (the paper asserts
# w^{u'} exists but gives no formula; the encoder is our design choice -- see
# docs/design/2026-09-04-affine-psi.md). Requires policy_index=latent: the index slot must
# carry u', because A and beta are by assumption independent of the policy index.
# `free` is the older shipped network psi(s, u, u'), i.e. the write-up's Rem. tradeoff row
# "free psi": the policy coordinate w^{u'} is ABSORBED into psi. Kept as an ablation switch;
# it is the arm that measured cube 0.083 where `affine` measures 0.532/0.620.
psi_form: affine           # affine | free
affine:
  w_dim: 128               # d_w, the policy-coordinate dimension (default = z_dim)
  encoder_hidden: 256      # w(.) encoder width (PhiMap shape)
  encoder_layers: 2
  norm_w: true             # w(u') on the UNIT sphere: pins the (cA, w/c) scale degeneracy
# Train the amortized latent actor. false (DEFAULT) drops the actor/CFM branch entirely; the
# write-up's Sec. PSMFlows has no actor. Only valid with acting=gpi.
train_actor: false

# S2 (InFOM-inspired implicit GPI). `max` is the shipped argmax over the index panel.
# `expectile` distills an upper expectile of psi(s, u', u)^T w over u' ~ p0 into a scalar
# head q_dist(s, u) and uses that for both acting and the actor gradient, so no argmax over
# samples of a learned function is ever taken -- E4a measured that argmax as the thing that
# kills ranking even for a critic proven to rank. Requires policy_index: latent.
# NOT a port of InFOM: InFOM has no z-conditioned -> z-free distillation, marginalizes by
# averaging over num_flow_goals, and draws ONE latent per update. index_panel: 1 is the
# setting closest to it; the plan's default of 16 is this repo's lower-variance choice.
index_agg: max             # max | expectile
expectile_mu: 0.9          # upper expectile; -> 1 approaches max over the index
index_panel: 16            # u' draws per state forming the target distribution
q_dist:
  hidden_dim: 512
  hidden_layers: 1
  embedding_layers: 2      # carried for symmetry; unused by the plain-MLP Value head
  lr: 3.0e-4

# Action branch: w-conditioned successor features over EXECUTED
# actions (psi_a shares phi and the w machinery) + an eps-bounded residual head.
# pessimism 0.0 on this branch by design: the collapse forensics showed exact-min
# pessimism drives the value collapse under a residual.
action_critic:
  enabled: false
  discount: 0.99
  tau: 0.005
  # Scalar-Q pessimism: BLEND WEIGHT in [0, 1] between the target ensemble's mean and its
  # least-task-valued member. (Before 08-14 this multiplied a PER-FEATURE spread, which is
  # sign-indefinite in Q-space -- it raised Q wherever w was negative. Do not read old
  # sweep values of this knob as pessimism levels; there were none, it has only ever run
  # at 0.0.)
  pessimism: 0.0
  lr: 3.0e-4
  hidden_dim: 512
  hidden_layers: 1
  embedding_layers: 2
  spread_candidates: 16    # candidates per state for the in-loop Q_a spread metric
  eval_rank_k: 0           # >0: EVAL-ONLY lambda-rank acting -- rank k decoded candidates
                           # by Q_a and execute the argmax, with no residual. Training is
                           # unaffected; used to separate ranking from pushing.
  # P2 FB graft: psi_a stops sharing the measure's basis. It gets its OWN backward map
  # B_a trained by the FB measure loss (contrastive + ortho, no pessimism, b_tau on the
  # target), and w_a is inferred from B_a. psi/phi/w and the latent actor are untouched;
  # only delta and Q_a move to (psi_a, w_a). Off = the shared-basis action critic.
  fb_graft: false
  ortho_coef: 1000.0       # FB's cube value for the B_a orthonormality term
  b_tau: 0.005             # FB's b_target_tau for B_a's target
residual_eps: 0.05         # hard per-dim budget on |a_exec - decode|
residual:
  hidden_dim: 256
  hidden_layers: 2
  embedding_layers: 2

# Fraction of TD bootstrap latents drawn from p0 instead of the actor. 0.0 = the backup as
# published (it only ever evaluates the actor's own latent). Raising it makes psi see the
# wider family: the fix direction for the flat-Q finding in logs/d3_q_landscape_cube.json.
backup_explore_frac: 0.0

# FROZEN behavior flow — must match the Stage-A `agent=fql agent.bc_only=true` run.
flow:
  hidden_dims: [512, 512, 512, 512]
  value_hidden_dims: [512, 512, 512, 512]
  layer_norm: false
  critic_layer_norm: true
flow_ckpt_path: null       # REQUIRED for real runs (dir glob, restore_agent convention)
flow_ckpt_epoch: null
allow_untrained_flow: false
preimage_path: null        # REQUIRED: tools/precompute_preimages.py output npz
use_point_preimage: true   # point-vs-mixture ablation. true is the default because
                           # main.py REFUSES a modern (corrected-target) preimage npz with
                           # false, and every published number was produced with true.

u_clip: 3.0                # typical-set clamp on latent draws
index_clip: null           # box for the policy-INDEX draws u' only (psi's index slot, the
                           # bootstrap action under policy_index=latent, GPI's u'); null = u_clip

gpi_num_u: 64
# Which of the gpi_num_u prior draws acting hands to the frozen flow. `argmax` (DEFAULT) is
# the shipped rule -- max over the (u_i, u'_j) pair scan -- and the ONLY value training
# ever uses; the rest are eval-time ablations of the selection itself.
# docs/design/2026-09-05-gpi-selection-diag.md measured the argmax to be (i) biased
# to large-norm latents at every checkpoint (selected |u| 2.8 vs the roster's 2.13) and
# (ii) re-randomised between checkpoints (per-u rho 0.21-0.36), i.e. mostly a max over K
# draws rather than a critic. They require policy_index=latent and index_agg=max.
#   max_norm             CRITIC-FREE control: pick the largest ||u|| of the K draws
#   top_quartile_random  CRITIC-FREE control: uniform among the top norm quartile
#   small_ball           argmax over candidates rejected above the prior median ||u||
#   soft_topm            uniform among the top gpi_topm candidates by GPI score
#   mean                 argmax of the ensemble MEAN (pessimism term dropped)
#   fixed_index          u' pinned to one draw for the whole eval; only u varies per step
gpi_select: argmax         # argmax | max_norm | top_quartile_random | small_ball
                           # | soft_topm | mean | fixed_index
#   prior_shrunk         CRITIC-FREE control: ONE prior draw scaled by gpi_prior_shrink,
#                        psi and task_z untouched. Added 2026-09-07 to test whether the
#                        DSRL-NA actor's value is its SUPPORT (latents held just inside the
#                        prior shell, u_norm 1.72 vs the prior median 2.13) rather than the
#                        GPI argmax it distills, which its regression only explains to ~6%.
gpi_topm: 8                # gpi_select=soft_topm only
gpi_index_seed: 0          # gpi_select=fixed_index only: which prior draw u' is pinned to
gpi_prior_shrink: 0.8      # gpi_select=prior_shrunk only. 0.8 * 2.13 = 1.70 ~ the dsrl_na
                           # actor's operating norm; 1.0 reproduces the BC control exactly.
gpi_decode: onestep        # onestep | ode
flow_decode_steps: 10

ob_dims: null
action_dim: null
encoder: null
